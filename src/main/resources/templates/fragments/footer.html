<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<footer th:fragment="footer" class="mt-5 py-4 border-top">
    <!-- container yerinə container-fluid və padding istifadə etdik -->
    <div class="container-fluid px-4 d-flex justify-content-between align-items-center">
        <p class="mb-0 text-muted">
            © 2026 <strong>Anonimly</strong> — Fikrini paylaş.
        </p>
        <a href="/swagger-ui.html"
           target="_blank"
           style="text-decoration:none;">
            Swagger
        </a>
    </div>
</footer>

<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const body = document.body;
        const toggleBtn = document.getElementById("themeToggle");
        const themeIcon = document.getElementById("theme-icon");
        const savedTheme = localStorage.getItem("theme") || "light";

        if (savedTheme === "dark") body.classList.add("dark-mode");
        themeIcon.className = savedTheme === "light" ? "bi bi-moon-fill" : "bi bi-sun-fill";

        toggleBtn.onclick = () => {
            body.classList.toggle("dark-mode");
            const isDark = body.classList.contains("dark-mode");
            themeIcon.className = isDark ? "bi bi-sun-fill" : "bi bi-moon-fill";
            localStorage.setItem("theme", isDark ? "dark" : "light");
        };
    </script>
</div>
</body>
</html>
