<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head(${post.title})}"></head>

<body>

<nav th:replace="~{fragments/header :: navbar}"></nav>

<main class="wrapper">
    <div class="container">
        <div class="row">
            <div class="col-lg-8 mx-auto">
                <div class="card p-4 mb-4">
                    <h2 class="fw-bold" th:text="${post.title}"></h2>
                    <div class="text-muted small mb-3">
                        <span th:text="${post.authorUsername}"></span>
                        · <span th:text="${post.createdAt}"></span>
                        · 👁 <span th:text="${post.viewCount}"></span>
                    </div>
                    <div th:text="${post.content}" class="lh-lg"></div>
                    <div class="mt-3 d-flex gap-2">
                        <button class="btn btn-sm btn-outline-danger"
                                th:attr="data-slug=${post.slug}"
                                onclick="react(this,'LIKE')">
                            👍 <span th:text="${post.likeCount}">0</span>
                        </button>
                        <button class="btn btn-sm btn-outline-dark"
                                th:attr="data-slug=${post.slug}"
                                onclick="react(this,'DISLIKE')">
                            👎 <span th:text="${post.dislikeCount}">0</span>
                        </button>
                    </div>
                </div>
                <div class="card p-4">
                    <h5 class="fw-bold mb-3">Comments</h5>
                    <div th:if="${#lists.isEmpty(comments)}" class="text-muted">No comments yet</div>

                    <div th:each="comment : ${comments}" class="mb-4 border rounded p-3">
                        <div>
                            <strong th:text="${comment.authorUsername}"></strong>
                            <p th:text="${comment.content}" class="mb-2"></p>
                            <div class="d-flex gap-2">
                                <button class="btn btn-sm btn-outline-primary"
                                        th:attr="data-id=${comment.id}"
                                        onclick="reactComment(this,'LIKE')">
                                    👍 <span th:text="${comment.likeCount}">0</span>
                                </button>
                                <button class="btn btn-sm btn-outline-dark"
                                        th:attr="data-id=${comment.id}"
                                        onclick="reactComment(this,'DISLIKE')">
                                    👎 <span th:text="${comment.likeCount}">0</span>
                                </button>
                                <button class="btn btn-sm btn-outline-secondary"
                                        th:attr="onclick=|toggleReply(${comment.id})|">
                                    Reply
                                </button>
                            </div>
                            <div th:id="'reply-' + ${comment.id}" style="display:none" class="mt-2 ms-3">
                                <form th:action="@{/web/posts/{slug}/comment(slug=${post.slug})}" method="post">
                                    <input type="hidden" name="parentId" th:value="${comment.id}"/>
                                    <textarea name="content" class="form-control mb-2" rows="2" placeholder="Write reply..."></textarea>
                                    <button class="btn btn-sm btn-primary">Send</button>
                                </form>
                            </div>
                            <div class="ms-4 mt-3 border-start ps-3">
                                <div th:each="reply : ${comment.replies}" class="mb-2">
                                    <strong th:text="${reply.authorUsername}"></strong>
                                    <p th:text="${reply.content}" class="mb-1"></p>
                                </div>
                            </div>
                        </div>
                    </div>
                    <form th:action="@{/web/posts/{slug}/comment(slug=${post.slug})}" method="post" class="mt-4">
                        <textarea name="content" class="form-control mb-2" rows="3" placeholder="Write comment..."></textarea>
                        <button class="btn btn-primary">Send</button>
                    </form>
                </div>

            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<div th:replace="~{fragments/footer :: scripts}"></div>

<script>
    function toggleReply(id){
        const el = document.getElementById("reply-" + id);
        el.style.display = (el.style.display === "block") ? "none" : "block";
    }

    async function react(btn,type){
        const slug = btn.getAttribute("data-slug");
        const res = await fetch(`/web/posts/${slug}/react?type=${type}`, { method:"POST" });
        if(await res.text()==="LOGIN"){ location.href="/login"; } else { location.reload(); }
    }

    async function reactComment(btn,type){
        const id = btn.getAttribute("data-id");
        const res = await fetch(`/web/comments/${id}/react?type=${type}`, { method:"POST" });
        if(await res.text()==="LOGIN"){ location.href="/login"; } else { location.reload(); }
    }
</script>

</body>
</html>
