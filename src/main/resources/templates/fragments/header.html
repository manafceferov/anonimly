<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' | Anonimly'">Anonimly</title>
    <link rel="icon" type="image/png" th:href="@{/favicon.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        html, body { height: 100%; margin: 0; }
        body { display: flex; flex-direction: column; }
        .wrapper { flex: 1; }

        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #212529;
            --navbar-bg: #1a1a2e;
            --nav-link: #ccc;
            --muted-text: #6c757d;
            --link-color: #212529;
        }

        body.dark-mode {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8f9fa;
            --navbar-bg: #1e293b;
            --nav-link: #94a3b8;
            --muted-text: #cbd5e1;
            --link-color: #f8f9fa;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s;
        }

        .navbar { background-color: var(--navbar-bg) !important; }

        .card {
            background-color: var(--card-bg) !important;
            color: var(--text-color) !important;
            border: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .nav-link { color: var(--nav-link) !important; }
        .text-muted { color: var(--muted-text) !important; }
        .text-dark { color: var(--link-color) !important; }

        .nav-tabs .nav-link { color: #212529 !important; }
        body.dark-mode .nav-tabs .nav-link { color: #cbd5e1 !important; }
        body.dark-mode .nav-tabs .nav-link.active {
            background-color: #1e293b !important;
            color: #ffffff !important;
            border-color: #334155 !important;
        }

        .navbar-brand {
            color: #e94560 !important;
            font-weight: bold;
            font-size: 1.5rem;
        }

        .theme-toggle-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: var(--nav-link);
        }

        .dropdown-menu {
            background-color: var(--card-bg);
            border: 1px solid #334155;
        }

        .dropdown-item { color: var(--text-color) !important; }
        .dropdown-item:hover { background-color: #e9456022 !important; }

        body.dark-mode .form-control {
            background-color: #0f172a !important;
            border: 1px solid #334155 !important;
            color: #f8f9fa !important;
        }

        body.dark-mode .form-control::placeholder {
            color: #cbd5e1 !important;
            opacity: 1;
        }
    </style>
</head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg mb-4">
    <div class="container-fluid d-flex justify-content-between align-items-center px-4">
        <a class="navbar-brand m-0" href="/">✍️ Anonimly</a>
        <div class="d-flex align-items-center">
            <button class="theme-toggle-btn me-3" id="themeToggle">
                <i id="theme-icon" class="bi bi-moon-fill"></i>
            </button>
            <a class="nav-link me-3" href="/">Ana səhifə</a>
            <div th:if="${session.userId == null}" class="d-flex align-items-center">
                <a class="nav-link me-3" href="/login">Giriş</a>
                <a class="nav-link" href="/register">Qeydiyyat</a>
            </div>
            <div class="dropdown" th:if="${session.userId != null}">
                <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                    <i class="bi bi-person-circle me-1"></i>
                    <span th:text="${session.username}">İstifadəçi</span>
                </a>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item" href="/web/profile"><i class="bi bi-person-badge me-2"></i> Profilim</a></li>
                    <li><a class="dropdown-item" href="/web/posts/new"><i class="bi bi-pencil-square me-2"></i> Yazı yaz</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item text-danger" href="/logout"><i class="bi bi-box-arrow-right me-2"></i> Çıxış</a></li>
                </ul>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
