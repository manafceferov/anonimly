<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' | Anonimly'">Anonimly</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar { background-color: #1a1a2e; }
        .navbar-brand { color: #e94560 !important; font-weight: bold; font-size: 1.5rem; }
        .nav-link { color: #ccc !important; }
        .nav-link:hover { color: #fff !important; }
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .btn-primary { background-color: #e94560; border-color: #e94560; }
        .btn-primary:hover { background-color: #c73652; border-color: #c73652; }
    </style>
</head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">✍️ Anonimly</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">Ana səhifə</a></li>
                <li class="nav-item"><a class="nav-link" href="/web/posts/new">Yazı yaz</a></li>
                <li class="nav-item"><a class="nav-link" href="/login">Giriş</a></li>
                <li class="nav-item"><a class="nav-link" href="/register">Qeydiyyat</a></li>
            </ul>
        </div>
    </div>
</nav>
</body>
</html>
