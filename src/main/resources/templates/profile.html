<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Profilim')}"></head>
<body>

<nav th:replace="~{fragments/header :: navbar}"></nav>

<div class="container">
    <div class="row">

        <!-- LEFT -->
        <div class="col-lg-4 mb-4">

            <div class="card p-4 text-center">

                <div class="mb-3">
                    <img th:if="${user.avatarUrl != null}"
                         th:src="${user.avatarUrl}"
                         class="rounded-circle"
                         style="width:90px;height:90px;object-fit:cover;">

                    <div th:if="${user.avatarUrl == null}"
                         class="rounded-circle d-inline-flex align-items-center justify-content-center"
                         style="width:90px;height:90px;background:#e94560;font-size:2rem;color:#fff;">
                        <span th:text="${#strings.substring(user.username, 0, 1).toUpperCase()}"></span>
                    </div>
                </div>

                <h5 class="fw-bold mb-1" th:text="${user.username}"></h5>
                <p class="text-muted small mb-1" th:text="${user.email}"></p>
                <p class="text-muted small mb-3"
                   th:text="${user.bio != null ? user.bio : 'Bio əlavə edilməyib'}"></p>

                <span class="badge bg-secondary" th:text="${user.role}"></span>

            </div>

            <div class="card p-4 mt-3">

                <h6 class="fw-bold mb-3">Məlumatları dəyiş</h6>

                <form th:action="@{/web/profile/edit}" method="post">

                    <input type="text" name="username"
                           class="form-control form-control-sm mb-2"
                           th:value="${user.username}">

                    <textarea name="bio"
                              class="form-control form-control-sm mb-2"
                              rows="3"
                              th:text="${user.bio}"></textarea>

                    <input type="text" name="avatarUrl"
                           class="form-control form-control-sm mb-2"
                           th:value="${user.avatarUrl}">

                    <button class="btn btn-primary btn-sm w-100">
                        Yadda saxla
                    </button>

                </form>

            </div>
        </div>

        <!-- RIGHT -->
        <div class="col-lg-8">

            <!-- TABS -->
            <ul class="nav nav-tabs mb-3">

                <li class="nav-item">
                    <a class="nav-link active"
                       data-bs-toggle="tab"
                       href="#posts-tab">
                        Yazılarım
                        <span class="badge bg-secondary ms-1"
                              th:text="${#lists.size(posts)}"></span>
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       data-bs-toggle="tab"
                       href="#comments-tab">
                        Şərhlər
                        <span class="badge bg-secondary ms-1"
                              th:text="${#lists.size(comments)}"></span>
                    </a>
                </li>

            </ul>

            <!-- IMPORTANT -->
            <div class="tab-content">

                <!-- POSTS (FULL ORIGINAL + SAFE) -->
                <div class="tab-pane fade show active" id="posts-tab">

                    <div th:if="${#lists.isEmpty(posts)}"
                         class="text-center text-muted py-5">
                        <i class="bi bi-journal-x fs-1"></i>
                        <p class="mt-3">Hələ heç bir yazı yoxdur.</p>
                    </div>

                    <div th:each="post : ${posts}" class="card mb-3 p-3">

                        <div class="d-flex justify-content-between align-items-start">

                            <div class="flex-grow-1">

                                <h6 class="fw-bold mb-2">
                                    <a th:href="@{/web/posts/{slug}(slug=${post.slug})}"
                                       th:text="${post.title}"
                                       class="text-decoration-none text-dark"></a>
                                </h6>

                                <div class="d-flex flex-wrap gap-3 text-muted small mb-2">

                                    <span>
                                        <i class="bi bi-clock"></i>
                                        <span th:text="${post.createdAt}"></span>
                                    </span>

                                    <span>
                                        <i class="bi bi-eye"></i>
                                        <span th:text="${post.viewCount ?: 0}"></span>
                                    </span>

                                    <span>
                                        <i class="bi bi-hand-thumbs-up"></i>
                                        <span th:text="${post.likeCount ?: 0}"></span>
                                    </span>

                                    <span>
                                        <i class="bi bi-hand-thumbs-down"></i>
                                        <span th:text="${post.dislikeCount ?: 0}"></span>
                                    </span>

                                    <span>
                                        <i class="bi bi-chat"></i>
                                        <span th:text="${post.commentCount ?: 0}"></span>
                                    </span>

                                </div>

                            </div>

                            <div class="d-flex gap-2 ms-3">

                                <!-- VIEW -->
                                <a th:href="@{/web/posts/{slug}(slug=${post.slug})}"
                                   class="btn btn-outline-secondary btn-sm">
                                    <i class="bi bi-eye"></i>
                                </a>

                                <!-- EDIT -->
                                <button class="btn btn-outline-primary btn-sm"
                                        data-bs-toggle="collapse"
                                        th:data-bs-target="'#editPost' + ${post.id}">
                                    <i class="bi bi-pencil"></i>
                                </button>

                                <!-- DELETE -->
                                <form th:action="@{/web/posts/{slug}/delete(slug=${post.slug})}"
                                      method="post">

                                    <button type="submit"
                                            class="btn btn-outline-danger btn-sm"
                                            onclick="return confirm('Silmək istədiyinizdən əminsiniz?')">
                                        <i class="bi bi-trash"></i>
                                    </button>

                                </form>

                            </div>

                        </div>

                        <!-- EDIT -->
                        <div class="collapse mt-3"
                             th:id="'editPost' + ${post.id}">

                            <form th:action="@{/web/posts/{id}/edit(id=${post.id})}"
                                  method="post">

                                <input type="text"
                                       name="title"
                                       class="form-control form-control-sm mb-2"
                                       th:value="${post.title}">

                                <textarea name="content"
                                          rows="4"
                                          class="form-control form-control-sm mb-2"></textarea>

                                <button class="btn btn-primary btn-sm">
                                    Yenilə
                                </button>

                            </form>

                        </div>

                    </div>
                </div>

                <!-- COMMENTS -->
                <div class="tab-pane fade" id="comments-tab">

                    <div th:if="${#lists.isEmpty(comments)}"
                         class="text-center text-muted py-5">
                        <i class="bi bi-chat-x fs-1"></i>
                        <p class="mt-3">Hələ heç bir şərh yazmamısınız.</p>
                    </div>

                    <div th:each="comment : ${comments}" class="card mb-3 p-3">

                        <p class="mb-1" th:text="${comment.content}"></p>

                        <small class="text-muted">

                            <i class="bi bi-clock"></i>
                            <span th:text="${comment.createdAt}"></span>

                            &nbsp;·&nbsp;

                            <!-- DÜZGÜN POST KEÇİDİ -->
                            <a th:href="@{/web/posts/{slug}(slug=${comment.postSlug})}"
                               class="text-decoration-none text-muted">

                                <i class="bi bi-arrow-right-circle"></i>
                                Posta keç

                            </a>

                        </small>
                    </div>

                </div>

            </div>

        </div>

    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<div th:replace="~{fragments/footer :: scripts}"></div>

</body>
</html>
