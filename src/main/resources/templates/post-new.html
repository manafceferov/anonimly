<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Yeni yazı')}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card p-4 mt-3">
                <h4 class="fw-bold mb-4">Yeni yazı</h4>
                <form th:action="@{/web/posts/new}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Başlıq</label>
                        <input type="text" name="title" class="form-control" placeholder="Yazının başlığı" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Məzmun</label>
                        <textarea name="content" class="form-control" rows="10" placeholder="Yazını buraya yaz..." required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Paylaş</button>
                    <a href="/" class="btn btn-outline-secondary ms-2">Ləğv et</a>
                </form>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
